name: Test optional inputs with trailing-slash base URL
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          jira-token: dummy-jira-token
          jira-base-url: https://example.atlassian.net/
          skip-branches: '^(production|staging)$'
          skip-comments: 'true'
          pr-threshold: '1000'
      - name: Assert action failed (no pull_request payload under workflow_dispatch)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure without a pull_request payload, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
